schema_version = "1.0.0"

id = "touch_view"
name = "Touch View"
version = "4.3.0"
tagline = "Creates active touch zones over View 2D and 3D areas"
maintainer = "NENDO, Karan @b3dhub"
type = "add-on"
tags = ["3D View", "User Interface"]
website = "https://github.com/nendotools/touchview"

blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2022-2026 NENDO, Karan @b3dhub"]

# Optional: bundle 3rd party Python modules.
# https://docs.blender.org/manual/en/dev/advanced/extensions/python_wheels.html
# wheels = ["./wheels/t3dn_bip-1.0.11-py3-none-any.whl"]

[permissions]
files = "preserve settings when enabling/disabling the add-on"

[build]
paths_exclude_pattern = [
  "__pycache__/",

  "/.agents/",
  "/.git/",
  "/.github/",
  "/.vscode/",
  "/docs/",
  "/releases/",
  "/tests/",

  "/*.zip",
  "/.gitignore",
  "/.gitmodules",
  "/AGENTS.md",
  "/Makefile",
  "/preferences.json",
  "/README.md",
  "/sync_agents.ps1",
]